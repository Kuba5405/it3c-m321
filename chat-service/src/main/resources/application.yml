spring:
  application:
    name: chat-service
  rabbitmq:
    # Im Docker-Netz heisst der Broker "rabbitmq". Beim Start ausserhalb
    # von Docker greift der Vorgabewert "localhost".
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Ein abgestürzter chat-service soll binnen Sekunden auffallen: der Broker
    # löscht dann seine exklusive Queue (Spezifikation 3, S4).
    requested-heartbeat: 5s
    listener:
      simple:
        # Höchstens 250 unbestätigte Nachrichten. Mit x-max-length 750 bleibt
        # die Instanzqueue unter 1000 (Spezifikation 3, S6).
        prefetch: 250

server:
  port: 8080
  tomcat:
    # Ein Client, der nie liest, würde beim Senden sonst ohne Ende blockieren und
    # die Zustellung an alle anderen Clients der Instanz anhalten. Nach 5 Sekunden
    # bricht Tomcat das Schreiben ab, die Verbindung wird entfernt (gemessen am
    # 13.11.2026: ohne diese Zeile hing der gesunde Client über 40 s fest).
    connection-timeout: 5s
    # connection-timeout gilt in Tomcat auch als Keep-Alive-Zeit. Ohne diese Zeile würde
    # eine ruhige Verbindung des Gateways nach 5 s gekappt und der nächste POST scheitern
    # (gemessen: «Connection reset» nach 7 s Ruhe, siehe KeepAliveIntegrationTest).
    keep-alive-timeout: 60s

logging:
  level:
    # Im Unterricht wollen wir jeden Schritt sehen.
    ch.benedict.m321: DEBUG
