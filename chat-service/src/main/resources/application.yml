spring:
  application:
    name: chat-service
  rabbitmq:
    # Im Docker-Netz heisst der Broker "rabbitmq". Beim Start ausserhalb
    # von Docker greift der Vorgabewert "localhost".
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Ein abgestürzter chat-service soll binnen Sekunden auffallen: der Broker
    # löscht dann seine exklusive Queue (Spezifikation 3, S4).
    requested-heartbeat: 5s
    listener:
      simple:
        # Höchstens 250 unbestätigte Nachrichten. Mit x-max-length 750 bleibt
        # die Instanzqueue unter 1000 (Spezifikation 3, S6).
        prefetch: 250

server:
  port: 8080

logging:
  level:
    # Im Unterricht wollen wir jeden Schritt sehen.
    ch.benedict.m321: DEBUG
